<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>سامانه انتخاب واحد هوشمند</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      background-color: #f4f4f4;
      padding: 50px;
    }
    h1 {
      color: #0b5394;
    }
    form {
      margin-top: 30px;
      background-color: #fff;
      padding: 20px;
      display: inline-block;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="file"] {
      margin: 10px 0;
    }
    table {
      margin: 30px auto;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #aaa;
      padding: 8px;
    }
    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h1>سامانه انتخاب واحد هوشمند</h1>
  <form>
    <label>فایل دروس پاس‌شده (CSV):</label><br>
    <input type="file" id="passedFile" accept=".csv"><br>

    <label>فایل دروس ارائه‌شده (CSV):</label><br>
    <input type="file" id="offeredFile" accept=".csv"><br>
  </form>

  <div id="result"></div>

  <script>
    let passedCourses = [];
    let offeredCourses = [];

    document.getElementById('passedFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        complete: function(results) {
          passedCourses = results.data.map(row => row['کد درس']);
          checkAndCompare();
        }
      });
    });

    document.getElementById('offeredFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        complete: function(results) {
          offeredCourses = results.data;
          checkAndCompare();
        }
      });
    });

    function checkAndCompare() {
      if (passedCourses.length === 0 || offeredCourses.length === 0) return;

      const suggestions = offeredCourses.filter(course =>
        !passedCourses.includes(course['کد درس'])
      );

      let html = "<h2>دروس پیشنهادی برای انتخاب واحد:</h2>";
      if (suggestions.length === 0) {
        html += "<p>همه‌ی دروس ارائه‌شده قبلاً پاس شده‌اند!</p>";
      } else {
        html += "<table><tr><th>کد درس</th><th>نام درس</th><th>نام استاد</th><th>زمان</th></tr>";
        suggestions.forEach(course => {
          html += `<tr>
            <td>${course['کد درس']}</td>
            <td>${course['نام درس']}</td>
            <td>${course['نام استاد']}</td>
            <td>${course['زمان']}</td>
          </tr>`;
        });
        html += "</table>";
      }

      document.getElementById("result").innerHTML = html;
    }
  </script>
</body>
</html>
